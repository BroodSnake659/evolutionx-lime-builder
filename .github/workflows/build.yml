name: Evolution X Lime Builder (Android 11)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --privileged

    steps:
    - name: Set up Environment and Prerequisites
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y tzdata
        apt-get install -y \
          git-lfs gnupg flex bison gperf squashfs-tools build-essential \
          zip curl ccache zlib1g-dev openjdk-11-jre openjdk-11-jdk \
          pngcrush schedtool libxml2 libxml2-utils xsltproc lzop \
          libc6-dev g++-multilib lib32z1-dev gcc-multilib maven tmux \
          screen w3m ncftp rsync libssl-dev libncurses5 lib32ncurses5-dev \
          libsdl1.2-dev libtinfo-dev bc libreadline-dev lib32readline-dev python2 python3 python-is-python3

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Evolution X Source
      run: |
        mkdir -p ~/workspace
        cd ~/workspace
        git config --global user.name "BroodSnake659"
        git config --global user.email "broodsnake@example.com"
        repo init -u https://github.com -b eleven --git-lfs

    - name: Clone Lime Device Trees
      run: |
        cd ~/workspace
        git clone https://github.com -b eleven device/xiaomi/lime || true

    - name: Set up CCache Engine
      run: |
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
        ccache -M 50G

    - name: Compile Evolution X ROM
      run: |
        cd ~/workspace
        . build/envsetup.sh
        lunch evolution_lime-userdebug || lunch lineage_lime-userdebug
        mka bacon -j$(nproc --all)

    - name: Upload Flashable ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EvolutionX-Lime-Android11-Flashable
        path: ~/workspace/out/target/product/lime/*.zip
