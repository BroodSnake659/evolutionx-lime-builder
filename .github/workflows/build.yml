name: Evolution X Lime Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-lfs gnupg flex bison gperf squashfs-tools build-essential \
          zip curl ccache zlib1g-dev openjdk-11-jre openjdk-11-jdk \
          pngcrush schedtool libxml2 libxml2-utils xsltproc lzop \
          libc6-dev g++-multilib lib32z1-dev gcc-multilib maven tmux \
          screen w3m ncftp rsync libssl-dev libncurses6 lib32ncurses6-dev \
          libsdl2-dev libtinfo-dev bc libreadline-dev lib32readline-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Evolution X Source
      run: |
        mkdir -p ~/workspace
        cd ~/workspace
        git config --global user.name "BroodSnake659"
        git config --global user.email "broodsnake@example.com"
        repo init -u https://github.com/Evolution-X/manifest -b bq2 --git-lfs

    - name: Clone Lime Device Trees
      run: |
        cd ~/workspace
        git clone https://github.com -b bq2 device/xiaomi/sm8450-common || true

    - name: Set up CCache Engine
      run: |
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
        ccache -M 50G

    - name: Compile Evolution X ROM
      run: |
        cd ~/workspace
        . build/envsetup.sh
        lunch lineage_lime-userdebug || lunch evolution_lime-userdebug
        m evolution -j$(nproc --all)

    - name: Upload Flashable ROM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EvolutionX-Lime-Flashable
        path: ~/workspace/out/target/product/lime/*.zip
